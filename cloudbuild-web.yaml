steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/web:latest'
      - '-f'
      - 'apps/web/Dockerfile'
      - 'apps/web'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/web:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/web:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        CMO_URL=$$(gcloud run services describe cmo-agent --region=us-central1 --format='value(status.url)')
        CROMEX_URL=$$(gcloud run services describe cromex-pricing-service --region=us-central1 --format='value(status.url)')
        gcloud run deploy frontend \
          --image=gcr.io/$PROJECT_ID/web:$COMMIT_SHA \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --port=3000 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --timeout=600 \
          --set-secrets=ARTICLE_API_KEY=article-api-key:latest,FIREBASE_PROJECT_ID=firebase-project-id:latest,CSM_PASSWORD_HASH=csm-password-hash:latest \
          --set-env-vars=CMO_AGENT_URL=$$CMO_URL,NEXT_PUBLIC_PRICING_API_URL=$$CROMEX_URL,PRICING_API_URL=$$CROMEX_URL,GCP_STORAGE_BUCKET=vazfy-417019-assets,CROMEX_BUCKET_NAME=vazfy-417019-assets

substitutions:
  _NEXT_PUBLIC_BASE_URL: 'https://eozore.com'

options:
  logging: CLOUD_LOGGING_ONLY
