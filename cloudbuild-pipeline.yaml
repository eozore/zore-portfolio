# cloudbuild-pipeline.yaml
# ============================================================
# Pipeline CI/CD da content pipeline éozoré.
# Trigger: `eozore-pipeline` (us-central1) — push na main com mudanças em
#          agents/pipeline/** ou neste arquivo.
#          Por muito tempo este comentário descreveu um trigger que NUNCA
#          foi criado, e toda correção da pipeline dependia de alguém
#          lembrar do comando manual. Criado em 23/08/2026.
#
# Variáveis de substituição (podem ser sobrescritas no trigger):
#   $_REGION      : us-central1
#   $_SA_EMAIL    : pipeline-jobs-sa@vazfy-417019.iam.gserviceaccount.com
#   $_GCS_BUCKET  : vazfy-417019-pipeline-media
#   $_HEYGEN_CB_URL: URL do heygen-callback
# ============================================================

substitutions:
  _REGION: us-central1
  _SA_EMAIL: pipeline-jobs-sa@vazfy-417019.iam.gserviceaccount.com
  _GCS_BUCKET: vazfy-417019-pipeline-media
  _HEYGEN_CB_URL: https://heygen-callback-4zffe4l4lq-uc.a.run.app

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ── Step 1: Build imagem unificada ───────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag
      - gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA
      - --tag
      - gcr.io/$PROJECT_ID/pipeline:latest
      - --cache-from
      - gcr.io/$PROJECT_ID/pipeline:latest
      - --file
      - agents/pipeline/Dockerfile
      - agents/pipeline
    waitFor: ["-"]

  # ── Step 2: Push imagem ───────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/pipeline
    waitFor: [build]

  # ── Step 3: Deploy pipeline-trigger ──────────────────────────
  # Recebe Pub/Sub push e aciona os Cloud Run Jobs
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-pipeline-trigger
    entrypoint: gcloud
    args:
      - run
      - deploy
      - pipeline-trigger
      - --image=gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8090
      - --command=uvicorn
      - --args=pipeline_trigger.app:app,--host,0.0.0.0,--port,8090
      - --min-instances=0
      - --max-instances=3
      - --memory=512Mi
      - --cpu=1
      - --timeout=30
      - --service-account=$_SA_EMAIL
      - --no-allow-unauthenticated
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET=$_GCS_BUCKET,TENANT_ID=default,GCP_REGION=$_REGION
    waitFor: [push]

  # ── Step 4: Deploy heygen-callback ───────────────────────────
  # Recebe webhook do HeyGen quando vídeo fica pronto
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-heygen-callback
    entrypoint: gcloud
    args:
      - run
      - deploy
      - heygen-callback
      - --image=gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8091
      - --command=uvicorn
      - --args=heygen_callback.app:app,--host,0.0.0.0,--port,8091
      - --min-instances=0
      - --max-instances=1
      - --memory=512Mi
      - --cpu=1
      - --timeout=60
      - --service-account=$_SA_EMAIL
      # PÚBLICO DE PROPÓSITO: o HeyGen chama este endpoint via webhook comum,
      # sem OIDC do Google — --no-allow-unauthenticated bloqueava 100% dos
      # callbacks antes de chegarem ao código, travando a produção de vídeo
      # com créditos HeyGen já consumidos. A defesa fica em heygen_callback/
      # app.py: token verificado por query string em callback_url (HeyGen não
      # suporta header customizado em webhook). O serviço lê o secret
      # heygen-callback-token direto via Secret Manager no startup — não
      # precisa de --set-secrets, que só injetaria um env var não lido.
      - --allow-unauthenticated
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET=$_GCS_BUCKET,TENANT_ID=default
    waitFor: [push]

  # ── Step 5: Deploy publisher-immediate ───────────────────────
  # API de publicação imediata: /publish-now, /scheduled, /queue-status
  # Precisa de 2GB para gerar thumbnails (Playwright + FFmpeg)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-publisher-immediate
    entrypoint: gcloud
    args:
      - run
      - deploy
      - publisher-immediate
      - --image=gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --port=8092
      - --command=uvicorn
      - --args=publisher_immediate.app:app,--host,0.0.0.0,--port,8092
      - --min-instances=0
      - --max-instances=2
      - --memory=2Gi
      - --cpu=2
      - --timeout=600
      - --service-account=$_SA_EMAIL
      - --no-allow-unauthenticated
      # YOUTUBE_UPLOAD_PRIVACY: private (default) | unlisted | public.
      # 'private' porque o vídeo sobe fechado para revisão: o dono do canal
      # assiste no Studio e torna público manualmente — e é esse ato que
      # libera a geração do pacote de conteúdos derivados. Trocar aqui
      # (versionado), não por comando manual: este --set-env-vars
      # sobrescreveria a alteração no deploy seguinte.
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET=$_GCS_BUCKET,TENANT_ID=default,YOUTUBE_UPLOAD_PRIVACY=private,PLAYWRIGHT_CHROMIUM_ARGS=--disable-dev-shm-usage --no-sandbox --disable-gpu
      - --set-secrets=YOUTUBE_OAUTH_CLIENT_ID=youtube-oauth-client-id:latest,YOUTUBE_OAUTH_CLIENT_SECRET=youtube-oauth-client-secret:latest,YOUTUBE_OAUTH_REFRESH_TOKEN=youtube-oauth-refresh-token:latest
    waitFor: [push]

  # ── Step 6: Update tts-job ────────────────────────────────────
  # ── package-job: geração do pacote editorial fora do request HTTP ──
  # `jobs update` falha se o job ainda não existir; o `|| jobs create` cobre
  # o primeiro deploy sem exigir que o Terraform rode antes.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-package-job
    entrypoint: bash
    args:
      - -c
      - |
        FLAGS="--image=gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA \
          --region=$_REGION \
          --command=python \
          --args=-m,package_job \
          --memory=1Gi \
          --cpu=1 \
          --task-timeout=3600s \
          --max-retries=0 \
          --service-account=$_SA_EMAIL \
          --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET=$_GCS_BUCKET,TENANT_ID=default,CMO_AGENT_URL=$$(gcloud run services describe cmo-agent --region=$_REGION --format='value(status.url)')"
        gcloud run jobs update package-job $$FLAGS || gcloud run jobs create package-job $$FLAGS
    waitFor: [push]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-tts-job
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - tts-job
      - --image=gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA
      - --region=$_REGION
      - --command=python
      - --args=-m,tts_job
      - --memory=512Mi
      - --cpu=1
      - --task-timeout=1800s
      - --max-retries=0
      - --service-account=$_SA_EMAIL
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET=$_GCS_BUCKET,TENANT_ID=default
      - --set-secrets=ELEVENLABS_API_KEY=elevenlabs-api-key:latest,ELEVENLABS_VOICE_ID=elevenlabs-voice-id:latest
    waitFor: [push]

  # ── Step 7: Update avatar-job ─────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-avatar-job
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - avatar-job
      - --image=gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA
      - --region=$_REGION
      - --command=python
      - --args=-m,avatar_job
      - --memory=512Mi
      - --cpu=1
      - --task-timeout=9000s
      - --max-retries=0
      - --service-account=$_SA_EMAIL
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET=$_GCS_BUCKET,TENANT_ID=default,HEYGEN_CALLBACK_URL=$_HEYGEN_CB_URL,HEYGEN_AVATAR_ID_HORIZONTAL=32e2ad6b3e5a45bf8c61cbf7220912f4,HEYGEN_AVATAR_ID_VERTICAL=d7fdce2942a244649820a0b5c989766f,HEYGEN_ENGINE=avatar_v
    waitFor: [push]

  # ── Step 8: Update video-editor-job (4 GB — Playwright + FFmpeg) ──
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-video-editor-job
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - video-editor-job
      - --image=gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA
      - --region=$_REGION
      - --command=python
      - --args=-m,video_editor_job
      - --memory=4Gi
      - --cpu=4
      - --task-timeout=3600s
      - --max-retries=0
      - --service-account=$_SA_EMAIL
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET=$_GCS_BUCKET,TENANT_ID=default,PLAYWRIGHT_CHROMIUM_ARGS=--disable-dev-shm-usage --no-sandbox --disable-gpu
    waitFor: [push]

  # ── Step 8b: Update vertical-cut-job ──────────────────────────
  # Deriva o Reel/Short do vídeo do YouTube (crop 9:16 + ilustração vertical).
  # Não chama HeyGen nem ElevenLabs. Criado no primeiro deploy pelo `|| create`,
  # sem depender do setup_jobs.sh ter rodado antes.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-vertical-cut-job
    entrypoint: bash
    args:
      - -c
      - |
        # Uma função em vez de uma variável com as flags: PLAYWRIGHT_CHROMIUM_ARGS
        # tem espaços, e uma variável expandida sem aspas seria quebrada pelo
        # shell em vários argumentos antes de chegar ao gcloud.
        # O "^##^" troca o separador de env vars de vírgula para ##.
        deploy() {
          gcloud run jobs "$$1" vertical-cut-job \
            --image=gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA \
            --region=$_REGION \
            --command=python \
            --args=-m,vertical_cut_job \
            --memory=4Gi \
            --cpu=4 \
            --task-timeout=3600s \
            --max-retries=0 \
            --service-account=$_SA_EMAIL \
            --set-env-vars="^##^GCP_PROJECT_ID=$PROJECT_ID##GCS_BUCKET=$_GCS_BUCKET##TENANT_ID=default##HEYGEN_AVATAR_CROP_X_RATIO=0.5##PLAYWRIGHT_CHROMIUM_ARGS=--disable-dev-shm-usage --no-sandbox --disable-gpu"
        }
        deploy update || deploy create
    waitFor: [push]

  # ── Step 9: Update publisher-scheduled ───────────────────────
  # Cloud Run Job que processa a fila agendada e publica em todas as plataformas
  # Precisa de 2GB para gerar thumbnails via Playwright
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-publisher-scheduled
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - publisher-scheduled
      - --image=gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA
      - --region=$_REGION
      - --command=python
      - --args=-m,publisher_job
      - --memory=2Gi
      - --cpu=2
      - --task-timeout=3600s
      - --max-retries=0
      - --service-account=$_SA_EMAIL
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCS_BUCKET=$_GCS_BUCKET,TENANT_ID=default,PLAYWRIGHT_CHROMIUM_ARGS=--disable-dev-shm-usage --no-sandbox --disable-gpu
      - --set-secrets=YOUTUBE_OAUTH_CLIENT_ID=youtube-oauth-client-id:latest,YOUTUBE_OAUTH_CLIENT_SECRET=youtube-oauth-client-secret:latest,YOUTUBE_OAUTH_REFRESH_TOKEN=youtube-oauth-refresh-token:latest

    waitFor: [push]

images:
  - gcr.io/$PROJECT_ID/pipeline:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/pipeline:latest
